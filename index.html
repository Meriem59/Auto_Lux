<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto lux - Pièces moto</title>
<style>
:root{--noir:#000;--gris:#141414;--gris2:#222;--rouge:#e8141f;--blanc:#fff;--txt:#b9b9b9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--noir);color:var(--blanc);font-family:"Trebuchet MS",Arial,sans-serif;line-height:1.5}
[dir=rtl] body{font-family:Tahoma,Arial,sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rouge);outline-offset:2px}

/* langue */
.lang{position:relative}
#langBtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--blanc);border:2px solid var(--blanc);border-radius:50%}
#langBtn:hover{border-color:var(--rouge);color:var(--rouge)}
.menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:150px;background:var(--gris);border:2px solid var(--rouge);border-radius:10px;overflow:hidden;z-index:50}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;padding:11px 16px;background:none;border:0;color:var(--blanc);text-align:start;font-weight:bold}
.menu button:hover,.menu button.on{background:var(--rouge)}

/* en-tête */
header{position:sticky;top:0;z-index:20;background:var(--noir);border-bottom:2px solid var(--rouge);display:flex;align-items:center;gap:16px;padding:8px 20px;flex-wrap:wrap}
header img{height:64px;width:auto;object-fit:contain;border-radius:6px}
.search{flex:1;min-width:200px}
.search input{width:100%;padding:11px 16px;border-radius:30px;border:2px solid var(--gris2);background:var(--gris);color:var(--blanc);font-size:1rem}
.search input:focus{outline:none;border-color:var(--rouge)}
#cartBtn{background:var(--rouge);color:var(--blanc);border:0;border-radius:30px;padding:11px 20px;font-weight:bold}
#cartBtn:hover{background:#c40f19}

/* hero */
.hero{padding:20px 20px 30px;text-align:center}
.biglogo{display:block;margin:0 auto;width:min(380px,80%);height:auto}
.hero p{color:var(--txt);margin-top:6px}

/* produits */
main{max-width:1200px;margin:0 auto;padding:0 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--gris);border:1px solid var(--gris2);border-top:3px solid var(--rouge);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:1.1rem}
.card .pimg{width:100%;height:180px;object-fit:cover;border-radius:8px;background:var(--noir)}
.card h3{flex:1}
.card .price{font-size:1.3rem;font-weight:bold}
.card .add{background:var(--blanc);color:var(--noir);border:0;border-radius:6px;padding:10px;font-weight:bold}
.card .add:hover{background:var(--rouge);color:var(--blanc)}
.empty{text-align:center;color:var(--txt);padding:50px 0;grid-column:1/-1}

/* panier */
#panier{position:fixed;top:0;inset-inline-end:0;width:min(400px,100%);height:100%;background:var(--gris);border-inline-start:2px solid var(--rouge);z-index:40;transform:translateX(110%);transition:transform .3s;display:flex;flex-direction:column}
[dir=rtl] #panier{transform:translateX(-110%)}
#panier.open,[dir=rtl] #panier.open{transform:none}
#panier h2{padding:18px;border-bottom:1px solid var(--gris2);display:flex;justify-content:space-between}
#panier h2 button{background:none;border:0;color:var(--blanc);font-size:1.4rem}
#items{flex:1;overflow:auto;padding:12px 18px}
.it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--gris2)}
.it small{color:var(--txt)}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--blanc);background:none;color:var(--blanc)}
.rm{background:none;border:0;color:var(--rouge);font-weight:bold}
.foot{padding:18px;border-top:1px solid var(--gris2)}
.ligne{display:flex;justify-content:space-between;color:var(--txt);margin-bottom:6px}
.total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:bold;margin-bottom:12px}
.foot input{width:100%;padding:10px;margin-bottom:8px;border-radius:6px;border:1px solid var(--gris2);background:var(--noir);color:var(--blanc)}
.cmd{width:100%;background:var(--rouge);color:var(--blanc);border:0;border-radius:6px;padding:13px;font-weight:bold}
#fond{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none}
#fond.open{display:block}
footer{text-align:center;color:var(--txt);padding:24px;border-top:2px solid var(--rouge)}
@media(prefers-reduced-motion:reduce){#panier{transition:none}}
</style>
</head>
<body>

<header>
  <img class="logo" src="images/im0.jpeg" alt="">
  <div class="search"><input id="q" type="search" data-p="search" placeholder="Rechercher une pièce par nom..." aria-label="Recherche"></div>
  <div class="lang">
    <button id="langBtn" aria-label="Langue / اللغة" aria-haspopup="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><ellipse cx="12" cy="12" rx="4" ry="9.5"/><path d="M2.5 12h19M4 7h16M4 17h16"/></svg></button>
    <div id="langMenu" class="menu" hidden>
      <button data-l="fr">Français</button>
      <button data-l="ar">العربية</button>
    </div>
  </div>
  <button id="cartBtn">🛒 <span data-t="panier">Panier</span> (<span id="count">0</span>)</button>
</header>

<div class="hero">
  <img class="logo biglogo" src="images/im0.jpeg" alt="">
  <p data-t="hero">Pièces moto de qualité pour toutes les marques</p>
</div>

<main><div class="grid" id="grid"></div></main>

<div id="fond"></div>
<aside id="panier" aria-label="Panier">
  <h2><span data-t="mypanier">Mon panier</span> <button id="close" aria-label="Fermer">✕</button></h2>
  <div id="items"></div>
  <div class="foot">
    <div class="ligne"><span data-t="subtotal">Sous-total</span><span id="sous">0 DH</span></div>
    <div class="ligne"><span data-t="livr">Frais de livraison</span><span id="liv">0 DH</span></div>
    <div class="total"><span data-t="total">Total</span><span id="total">0 DH</span></div>
    <input id="nom" data-p="nom" placeholder="Votre nom">
    <input id="tel" data-p="tel" type="tel" placeholder="Votre téléphone">
    <input id="ville" data-p="ville" placeholder="Votre ville">
    <input id="adresse" data-p="adresse" placeholder="Votre adresse complète">
    <button class="cmd" id="cmd" data-t="cmd">Commander sur WhatsApp</button>
  </div>
</aside>

<footer><span data-t="foot">© Auto lux - Tous droits réservés</span></footer>

<script>
// ====== A MODIFIER ======
const WHATSAPP = "2120633605758"; // numéro WhatsApp
const LIVRAISON = 35; // frais de livraison (DH)
let sous = 0, tot = 0;
// Chaque article : [nom, prix (DH), chemin de l'image]
// Mettez vos photos dans un dossier "images" à côté de index.html
const P = [
 ["enjoliveur 13 pous ",150 ,"images/im1.jpeg"],
 ["enjoliveur 14 pous ",160 ,"images/im1.jpeg"],
 ["enjoliveur 15 pous ",200 ,"images/im1.jpeg"],
 ["enjoliveur 16 pous ",220 ,"images/im1.jpeg"],
 ["cover volent",50,"images/im2.jpeg"],
 ["Adisaif de port",65,"images/im3.jpeg"],
 ["housse t cotté tusse semi cuir",499,"images/im4.jpeg"],
 ["caméra 4g adistance ",1250,"images/im5.jpeg"],
 ["packe ecron 1300dh + radar 150dh +camera arieer 120dh + caméra avant 280dh",1850,"images/im6.jpeg"],
 ["caldo grand bille",150,"images/im7.jpeg"],
 ["radio MP3 BT ",180,"images/im8.jpeg"], 
 ["tapis 4d truck ",350,"images/im10.jpeg"],
 ["baff Pioneer 17cm",350,"images/im11.jpeg"],
 ["1 antigen valio ghouz",70,"images/im12.jpeg"],
 ["2 lav glass 1L",15,"images/im12.jpeg"],
 ["3 antigine verte ",25,"images/im12.jpeg"],
 ["turbo led focus H7 H4 H1 H11 9005 9006 ",180,"images/im13.jpeg"],
 ["caldeau pélot",1100,"images/im14.jpeg"],
 ["flamengo scratch remover",80,"images/im15.jpeg"],
 ["suport de téléphone",65,"images/im16.jpeg"],
 ["housse caldeou",900,"images/im17.jpeg"],
 ["cric2 ton",300,"images/im18.jpeg"],
 ["poit meni cendrie (double boit )",80,"images/im19.jpeg"],
 ["helecoupter parfum ",80,"images/im20.jpeg"],
 ["caméra 3cam plus app wifi",600,"images/im21.jpeg"],
 ["boston baf ",180,"images/im22.jpeg"],
 ["retroviseur intérieur",60,"images/im23.jpeg"], 
 ["acoudoir grand modél ",250,"images/im25.jpeg"],
 ["Led A80",320,"images/im26.jpeg"],
 ["cover volant fem",90,"images/im27.jpeg"], 
 ["led ambiance a80",500,"images/im28.jpeg"],
 ["acoudoir sur mesur",299,"images/im29.jpeg"],
 ["polish car wax 80dh - flamengo shampo 45dh -  wheel gent 70 dh -  speed tissus 70dh -  nettoyant pneu 70 -  nettoyant cuir 70 -  nettoyant tableu de bord 30dh",435,"images/im30.jpeg"],
 ["cover volant tissus",90,"images/im31.jpeg"], 
 ["car cover partire de ",350,"images/im33.jpeg"],
 ["led hedlight turbo ",250,"images/im34.jpeg"],
 ["aspirateur",120,"images/im35.jpeg"],
 ["baf",180,"images/im36.jpeg"],
 ["cric 1ton manivelle",120,"images/im37.jpeg"],
 ["caldo",900,"images/im38.jpeg"],
 ["housse tissus",320,"images/im39.jpeg"],
 ["acoudoiar large",270,"images/im40.jpeg"],
 ["acoudoiar colis standard ",150,"images/im41.jpeg"],
 ["caldo dos",80,"images/im42.jpeg"],
 ["tapis 7D",399,"images/im43.jpeg"],
 ["Coverw cossin tissu avant",350,"images/im44.jpeg"],
 ["Les logos jantes aluminyoume",50,"images/im45.jpeg"],
 ["Coverw cossin tissu avant",350,"images/im46.jpeg"],
 ["Silicon pour siéger avant",180,"images/im47.jpeg"],
 ["Housse caldeau",950,"images/im48.jpeg"],
 ["Logo calendre av mer 205",650,"images/im49.jpeg"],
 ["Hosse coté tissu",550,"images/im50.jpeg"],
 ["Rangement de coffres",250,"images/im51.jpeg"],
 ["Carte playlist",300,"images/im52.jpeg"],
 ["Housse caldeou ",950,"images/im53.jpeg"],
 ["Housse caldeou",950,"images/im54.jpeg"],
 ["Silicon pour do",299,"images/im55.jpeg"],
 ["Coverw cossin tissu avant",350,"images/im56.jpeg"],
 ["Coverw cossin tissu avant",350,"images/im57.jpeg"],
 ["Gps manitique",800,"images/im58.jpeg"],
 ["Hosse coté tissu",1300,"images/im59.jpeg"],
 ["Houss côté tissu",550,"images/im60.jpeg"],
 ["Houss côté tissu",550,"images/im61.jpeg"],
 ["Houss côté tissu",559,"images/im62.jpeg"],
 ["Houss côté tissu",350,"images/im63.jpeg"],
 ["Box  androiad",800,"images/im64.jpeg"],
 ["Houss côté tissu",1300,"images/im65.jpeg"]
];
// ========================
const T={
 fr:{panier:"Panier",mypanier:"Mon panier",hero:"Pièces moto de qualité pour toutes les marques",search:"Rechercher une pièce par nom...",subtotal:"Sous-total",livr:"Frais de livraison",total:"Total",nom:"Votre nom",tel:"Votre téléphone",ville:"Votre ville",adresse:"Votre adresse complète",cmd:"Commander sur WhatsApp",foot:"© Auto lux - Tous droits réservés",order:"Commander",remove:"Supprimer",noitem:"Aucun article trouvé.",emptycart:"Votre panier est vide.",needinfo:"Entrez votre nom, téléphone, ville et adresse.",dh:"DH"},
 ar:{panier:"السلة",mypanier:"سلتي",hero:"قطع غيار الدراجات النارية بجودة عالية لجميع الماركات",search:"ابحث عن قطعة بالاسم...",subtotal:"المجموع الفرعي",livr:"مصاريف التوصيل",total:"المجموع",nom:"اسمك",tel:"رقم هاتفك",ville:"مدينتك",adresse:"عنوانك الكامل",cmd:"اطلب عبر واتساب",foot:"© أوطو لوكس - جميع الحقوق محفوظة",order:"اطلب",remove:"حذف",noitem:"لا توجد منتجات.",emptycart:"سلتك فارغة.",needinfo:"المرجو إدخال الاسم والهاتف والمدينة والعنوان.",dh:"درهم"}
};


let lang="fr";
try{lang=localStorage.getItem("al_lang")||"fr"}catch(e){}
const t=k=>T[lang][k];
const nm=i=>P[i][0];
let cart={};
try{cart=JSON.parse(localStorage.getItem("al_cart")||"{}")}catch(e){}
const $=id=>document.getElementById(id);

function save(){try{localStorage.setItem("al_cart",JSON.stringify(cart))}catch(e){}}

function drawGrid(){
  const q=$("q").value.trim().toLowerCase();
  const list=P.map((p,i)=>i).filter(i=>P[i][0].toLowerCase().includes(q));
  $("grid").innerHTML=list.length?list.map(i=>`
   <article class="card">
     <img class="pimg" src="${P[i][2]}" alt="${nm(i)}" loading="lazy" onerror="this.style.visibility='hidden'">
     <h3>${nm(i)}</h3>
     <div class="price">${P[i][1]} ${t("dh")}</div>
     <button class="add" data-i="${i}">${t("order")}</button>
   </article>`).join(""):`<div class="empty">${t("noitem")}</div>`;
}
function drawCart(){
  const ids=Object.keys(cart);let total=0,n=0;
  $("items").innerHTML=ids.length?ids.map(i=>{
    const p=P[i],q=cart[i];total+=p[1]*q;n+=q;
    return `<div class="it"><div><strong>${nm(i)}</strong><br><small>${p[1]} ${t("dh")}</small>
    <div class="qty"><button data-d="-1" data-i="${i}">-</button>${q}<button data-d="1" data-i="${i}">+</button></div></div>
    <button class="rm" data-r="${i}">${t("remove")}</button></div>`}).join(""):`<p style="color:var(--txt);padding:20px 0">${t("emptycart")}</p>`;
  sous=total;const liv=ids.length?LIVRAISON:0;tot=total+liv;
  $("sous").textContent=total+" "+t("dh");$("liv").textContent=liv+" "+t("dh");$("total").textContent=tot+" "+t("dh");
  $("count").textContent=n;save();
}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[lang][e.dataset.t]);
  document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=T[lang][e.dataset.p]);
  document.querySelectorAll("#langMenu button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  drawGrid();drawCart();
}
function openCart(o){$("panier").classList.toggle("open",o);$("fond").classList.toggle("open",o)}

$("q").oninput=drawGrid;
$("grid").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){cart[i]=(cart[i]||0)+1;drawCart();openCart(true)}};
$("items").onclick=e=>{
  const el=e.target,i=el.dataset.i;
  if(el.dataset.d){cart[i]+=+el.dataset.d;if(cart[i]<1)delete cart[i]}
  if(el.dataset.r)delete cart[el.dataset.r];
  drawCart();
};
$("langBtn").onclick=e=>{e.stopPropagation();$("langMenu").hidden=!$("langMenu").hidden};
$("langMenu").onclick=e=>{const l=e.target.dataset.l;if(l){lang=l;try{localStorage.setItem("al_lang",lang)}catch(x){}applyLang();$("langMenu").hidden=true}};
document.addEventListener("click",()=>{$("langMenu").hidden=true});
$("cartBtn").onclick=()=>openCart(true);
$("close").onclick=$("fond").onclick=()=>openCart(false);
$("cmd").onclick=()=>{
  const ids=Object.keys(cart);
  if(!ids.length)return alert(t("emptycart"));
  const nom=$("nom").value.trim(),
        tel=$("tel").value.trim(),
        ville=$("ville").value.trim(),
        adresse=$("adresse").value.trim();
  if(!nom||!tel||!ville||!adresse)return alert(t("needinfo"));
  let m="Nouvelle commande Auto lux\n";
  ids.forEach(i=>m+=`- ${P[i][0]} x${cart[i]} = ${P[i][1]*cart[i]} DH\n`);
  m+=`Sous-total: ${sous} DH\nLivraison: ${LIVRAISON} DH\nTotal: ${tot} DH\n`;
  m+=`Nom: ${nom}\nTel: ${tel}\nVille: ${ville}\nAdresse: ${adresse}`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(m)}`,"_blank");
};
applyLang();
</script>
</body>
</html>
