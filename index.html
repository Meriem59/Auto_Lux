<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto lux - Pièces moto</title>
<style>
:root{--noir:#000;--gris:#141414;--gris2:#222;--rouge:#e8141f;--blanc:#fff;--txt:#b9b9b9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--noir);color:var(--blanc);font-family:"Trebuchet MS",Arial,sans-serif;line-height:1.5}
[dir=rtl] body{font-family:Tahoma,Arial,sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rouge);outline-offset:2px}

/* langue */
.lang{position:relative}
#langBtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--blanc);border:2px solid var(--blanc);border-radius:50%}
#langBtn:hover{border-color:var(--rouge);color:var(--rouge)}
.menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:150px;background:var(--gris);border:2px solid var(--rouge);border-radius:10px;overflow:hidden;z-index:50}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;padding:11px 16px;background:none;border:0;color:var(--blanc);text-align:start;font-weight:bold}
.menu button:hover,.menu button.on{background:var(--rouge)}

/* en-tête */
header{position:sticky;top:0;z-index:20;background:var(--noir);border-bottom:2px solid var(--rouge);display:flex;align-items:center;gap:16px;padding:8px 20px;flex-wrap:wrap}
header img{height:64px;width:64px;object-fit:cover;border-radius:6px}
.search{flex:1;min-width:200px}
.search input{width:100%;padding:11px 16px;border-radius:30px;border:2px solid var(--gris2);background:var(--gris);color:var(--blanc);font-size:1rem}
.search input:focus{outline:none;border-color:var(--rouge)}
#cartBtn{background:var(--rouge);color:var(--blanc);border:0;border-radius:30px;padding:11px 20px;font-weight:bold}
#cartBtn:hover{background:#c40f19}

/* hero */
.hero{padding:20px 20px 30px;text-align:center}
.biglogo{display:block;margin:0 auto;width:min(380px,80%);height:auto}
.hero p{color:var(--txt);margin-top:6px}

/* produits */
main{max-width:1200px;margin:0 auto;padding:0 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--gris);border:1px solid var(--gris2);border-top:3px solid var(--rouge);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:1.1rem}
.card p{color:var(--txt);font-size:.92rem;flex:1}
.card .price{font-size:1.3rem;font-weight:bold}
.card .add{background:var(--blanc);color:var(--noir);border:0;border-radius:6px;padding:10px;font-weight:bold}
.card .add:hover{background:var(--rouge);color:var(--blanc)}
.empty{text-align:center;color:var(--txt);padding:50px 0;grid-column:1/-1}

/* panier */
#panier{position:fixed;top:0;inset-inline-end:0;width:min(400px,100%);height:100%;background:var(--gris);border-inline-start:2px solid var(--rouge);z-index:40;transform:translateX(110%);transition:transform .3s;display:flex;flex-direction:column}
[dir=rtl] #panier{transform:translateX(-110%)}
#panier.open,[dir=rtl] #panier.open{transform:none}
#panier h2{padding:18px;border-bottom:1px solid var(--gris2);display:flex;justify-content:space-between}
#panier h2 button{background:none;border:0;color:var(--blanc);font-size:1.4rem}
#items{flex:1;overflow:auto;padding:12px 18px}
.it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--gris2)}
.it small{color:var(--txt)}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--blanc);background:none;color:var(--blanc)}
.rm{background:none;border:0;color:var(--rouge);font-weight:bold}
.foot{padding:18px;border-top:1px solid var(--gris2)}
.ligne{display:flex;justify-content:space-between;color:var(--txt);margin-bottom:6px}
.total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:bold;margin-bottom:12px}
.foot input{width:100%;padding:10px;margin-bottom:8px;border-radius:6px;border:1px solid var(--gris2);background:var(--noir);color:var(--blanc)}
.cmd{width:100%;background:var(--rouge);color:var(--blanc);border:0;border-radius:6px;padding:13px;font-weight:bold}
#fond{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none}
#fond.open{display:block}
footer{text-align:center;color:var(--txt);padding:24px;border-top:2px solid var(--rouge)}
@media(prefers-reduced-motion:reduce){#panier{transition:none}}
</style>
</head>

document.querySelectorAll(".logo").forEach(i=>i.src=LOGO);

let lang="fr";
try{lang=localStorage.getItem("al_lang")||"fr"}catch(e){}
const t=k=>T[lang][k];
const nm=i=>lang==="ar"?AR[i][0]:P[i][0];
const ds=i=>lang==="ar"?AR[i][1]:P[i][2];
let cart={};
try{cart=JSON.parse(localStorage.getItem("al_cart")||"{}")}catch(e){}
const $=id=>document.getElementById(id);

function save(){try{localStorage.setItem("al_cart",JSON.stringify(cart))}catch(e){}}

function drawGrid(){
  const q=$("q").value.trim().toLowerCase();
  const list=P.map((p,i)=>i).filter(i=>(P[i][0]+" "+AR[i][0]).toLowerCase().includes(q));
  $("grid").innerHTML=list.length?list.map(i=>`
   <article class="card">
     <h3>${nm(i)}</h3>
     <p>${ds(i)}</p>
     <div class="price">${P[i][1]} ${t("dh")}</div>
     <button class="add" data-i="${i}">${t("order")}</button>
   </article>`).join(""):`<div class="empty">${t("noitem")}</div>`;
}
function drawCart(){
  const ids=Object.keys(cart);let total=0,n=0;
  $("items").innerHTML=ids.length?ids.map(i=>{
    const p=P[i],q=cart[i];total+=p[1]*q;n+=q;
    return `<div class="it"><div><strong>${nm(i)}</strong><br><small>${p[1]} ${t("dh")}</small>
    <div class="qty"><button data-d="-1" data-i="${i}">-</button>${q}<button data-d="1" data-i="${i}">+</button></div></div>
    <button class="rm" data-r="${i}">${t("remove")}</button></div>`}).join(""):`<p style="color:var(--txt);padding:20px 0">${t("emptycart")}</p>`;
  sous=total;const liv=ids.length?LIVRAISON:0;tot=total+liv;
  $("sous").textContent=total+" "+t("dh");$("liv").textContent=liv+" "+t("dh");$("total").textContent=tot+" "+t("dh");
  $("count").textContent=n;save();
}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[lang][e.dataset.t]);
  document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=T[lang][e.dataset.p]);
  document.querySelectorAll("#langMenu button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  drawGrid();drawCart();
}
function openCart(o){$("panier").classList.toggle("open",o);$("fond").classList.toggle("open",o)}

$("q").oninput=drawGrid;
$("grid").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){cart[i]=(cart[i]||0)+1;drawCart();openCart(true)}};
$("items").onclick=e=>{
  const el=e.target,i=el.dataset.i;
  if(el.dataset.d){cart[i]+=+el.dataset.d;if(cart[i]<1)delete cart[i]}
  if(el.dataset.r)delete cart[el.dataset.r];
  drawCart();
};
$("langBtn").onclick=e=>{e.stopPropagation();$("langMenu").hidden=!$("langMenu").hidden};
$("langMenu").onclick=e=>{const l=e.target.dataset.l;if(l){lang=l;try{localStorage.setItem("al_lang",lang)}catch(x){}applyLang();$("langMenu").hidden=true}};
document.addEventListener("click",()=>{$("langMenu").hidden=true});
$("cartBtn").onclick=()=>openCart(true);
$("close").onclick=$("fond").onclick=()=>openCart(false);
$("cmd").onclick=()=>{
  const ids=Object.keys(cart);
  if(!ids.length)return alert(t("emptycart"));
  if(!$("nom").value||!$("tel").value)return alert(t("needinfo"));
  let m="Nouvelle commande Auto lux%0A";
  ids.forEach(i=>m+=`- ${P[i][0]} x${cart[i]} = ${P[i][1]*cart[i]} DH%0A`);
  m+=`Sous-total: ${sous} DH%0ALivraison: ${LIVRAISON} DH%0ATotal: ${tot} DH%0ANom: ${encodeURIComponent($("nom").value)}%0ATel: ${encodeURIComponent($("tel").value)}`;
  window.open(`https://wa.me/${WHATSAPP}?text=${m}`,"_blank");
};
applyLang();
</script>
</body>
</html>
